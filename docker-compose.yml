services:
  postgres:
    build: ./db
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB={POSTGRES_DB}
    command: -p ${POSTGRES_PORT}

  server:
    build: .
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /usr/src/app/src
    env_file:
      - path: .env
    ports:
      - ${PORT}:${PORT}
    depends_on:
      - postgres
